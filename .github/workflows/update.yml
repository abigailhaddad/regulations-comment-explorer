name: Rebuild data, test, deploy

# The dataset is rebuilt from spicy-regs on every run rather than committed:
# it is ~8.7 MB across dockets.json and titles.json and changes daily, so
# committing it would bloat the repo for no benefit — the live site is the only
# copy that needs to be current.
#
# Nothing reaches the site until both suites pass. A broken build here still
# returns HTTP 200, so "the deploy succeeded" is not evidence of anything.
on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC daily (~5am ET), off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'build_data.py'
      - 'agency_names.json'
      - '.github/workflows/update.yml'
  pull_request:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet duckdb pytest pytest-playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Rebuild dockets.json and titles.json from spicy-regs
        run: python build_data.py

      - name: Data tests
        run: python -m pytest tests/test_data.py -q

      - name: Serve the site
        run: |
          python3 -m http.server 8899 --directory web &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8899/index.html && exit 0
            sleep 1
          done
          echo "server never came up" >&2
          exit 1

      - name: Frontend tests
        run: python -m pytest tests/test_frontend.py -q

      # Only reached if every test above passed.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy web \
            --project-name=regulations-comments \
            --branch=main \
            --commit-dirty=true

      - name: Check the live site actually serves
        if: github.event_name != 'pull_request'
        run: |
          sleep 15
          for url in https://regulations-comments.abigailhaddad.com/ \
                     https://regulations-comments.abigailhaddad.com/data/dockets.json \
                     https://regulations-comments.abigailhaddad.com/data/titles.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url")
            echo "$code  $url"
            [ "$code" = "200" ] || exit 1
          done
