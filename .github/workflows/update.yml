name: Rebuild data and deploy

# The dataset is rebuilt from spicy-regs on every run rather than committed:
# it is 8.7 MB and changes daily, so committing it would bloat the repo for no
# benefit — the live site is the only copy that needs to be current.
on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC daily (~5am ET), off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:                  # front-end changes should redeploy immediately
      - 'web/**'
      - 'build_data.py'
      - '.github/workflows/update.yml'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet duckdb

      - name: Rebuild dockets.json from spicy-regs
        run: python build_data.py

      # A truncated or empty build would deploy a broken site that still returns
      # 200. Check the file is plausible before it goes anywhere.
      - name: Sanity-check the build
        run: |
          python - <<'PY'
          import json, os, sys
          p = "web/data/dockets.json"
          size = os.path.getsize(p)
          data = json.load(open(p))
          n = len(data["dockets"])
          total = sum(d[4] for d in data["dockets"])
          print(f"{size/1e6:.1f} MB · {n:,} dockets · {total:,} comments")
          if size < 5_000_000:  sys.exit(f"too small: {size} bytes")
          if n < 50_000:        sys.exit(f"too few dockets: {n}")
          if total < 20_000_000: sys.exit(f"too few comments: {total}")
          PY

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy web \
            --project-name=regulations-comments \
            --branch=main \
            --commit-dirty=true
